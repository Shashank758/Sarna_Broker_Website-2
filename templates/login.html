<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Saarna Canvessars</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0f9b5f;
            --primary-dark: #0d8a54;
            --primary-light: #12b36e;
            --accent: #25d366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f9b5f 0%, #0a7548 50%, #064e30 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        .bg-shapes {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            top: 0;
            left: 0;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            animation: float 15s infinite ease-in-out;
        }

        .bg1 {
            width: 400px;
            height: 400px;
            top: -150px;
            left: -150px;
        }

        .bg2 {
            width: 300px;
            height: 300px;
            bottom: -100px;
            right: -100px;
            animation-delay: 3s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        .auth-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 20px;
            z-index: 10;
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .brand {
            text-align: center;
            color: #fff;
            margin-bottom: 30px;
        }

        .brand-icon {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .brand-icon i {
            font-size: 35px;
            color: #fff;
        }

        .brand h2 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .brand p {
            opacity: 0.8;
            font-size: 14px;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .auth-card h4 {
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
            text-align: center;
        }

        .auth-card>p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .input-group {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            transition: all 0.3s ease;
            background: #fff;
            overflow: hidden;
        }

        .input-group:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(15, 155, 95, 0.1);
        }

        .input-group-text {
            background: #f8fafc;
            border: none;
            padding: 14px 18px;
            color: #64748b;
        }

        .form-control {
            border: none;
            padding: 14px 18px 14px 0;
            font-size: 15px;
            font-weight: 500;
        }

        .form-control:focus {
            box-shadow: none;
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            padding: 14px;
            border-radius: 12px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(15, 155, 95, 0.3);
            color: #fff;
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .auth-footer p {
            color: #64748b;
            font-size: 14px;
            margin: 5px 0;
        }

        .auth-footer a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .alert {
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 25px;
            border: none;
        }

        .alert-danger {
            background-color: #fef2f2;
            color: #991b1b;
        }

        .alert-success {
            background-color: #f0fdf4;
            color: #166534;
        }
    </style>
</head>

<body>
    <div class="bg-shapes">
        <div class="bg-circle bg1"></div>
        <div class="bg-circle bg2"></div>
    </div>

    <div class="auth-wrapper">
        <div class="brand">
            <div class="brand-icon">
                <i class="fa fa-seedling"></i>
            </div>
            <h2>Saarna Canvessars</h2>
            <p>Digital Mandi • Trusted Crop Trading Platform</p>
        </div>

        <div class="auth-card">
            <h4>Welcome Back</h4>
            <p>Enter your credentials to access your account</p>

            {% if error %}
            <div class="alert alert-danger animate__animated animate__shakeX">
                <i class="fa fa-exclamation-circle me-2"></i> {{ error }}
            </div>
            {% endif %}

            {% if success %}
            <div class="alert alert-success">
                <i class="fa fa-check-circle me-2"></i> {{ success }}
            </div>
            {% endif %}

            <form method="POST">
                <div class="form-group">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa fa-envelope"></i>
                        </span>
                        <input name="email" type="email" class="form-control" placeholder="Email Address" required
                            autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa fa-lock"></i>
                        </span>
                        <input name="password" type="password" class="form-control" placeholder="Password" required>
                    </div>
                </div>

                <div class="d-flex justify-content-end mb-4">
                    <a href="/forgot-password" class="text-xs fw-bold text-success text-decoration-none"
                        style="font-size: 13px;">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-login w-100">
                    Login to Portal <i class="fa fa-arrow-right ms-2"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>New to Saarna Canvessars?</p>
                <a href="/register">Create a Free Account</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
